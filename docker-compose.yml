services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyrelle
      POSTGRES_PASSWORD: cyrelle
      POSTGRES_DB: cyrelle
    ports:
      - "5432:5432"
    volumes:
      - cyrelle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyrelle"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://cyrelle:cyrelle@postgres:5432/cyrelle
      REDIS_URL: redis://redis:6379
      PAYMENT_PROVIDER: test
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker.js
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://cyrelle:cyrelle@postgres:5432/cyrelle
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  cyrelle-postgres:
